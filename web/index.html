<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>x.local Camera</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <div>
      <span class="eyebrow">DEEPFAKE CAMERA</span>
      <h1>x.local</h1>
    </div>
    <span id="status" class="status">aguardando câmera</span>
  </header>

  <section class="viewer">
    <video id="preview" autoplay playsinline muted></video>
    <div id="placeholder">Toque em “Ativar câmera”</div>
  </section>

  <section class="controls">
    <button id="start">Ativar câmera</button>
    <button id="stop" disabled>Parar</button>
    <button id="flip" disabled>Virar câmera</button>
  </section>

  <section class="info">
    <div><b>Fonte</b><span id="source">—</span></div>
    <div><b>Resolução</b><span id="resolution">—</span></div>
    <div><b>Pronto para engine</b><span>WebRTC / WebSocket</span></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
